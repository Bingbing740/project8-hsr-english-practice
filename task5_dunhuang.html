<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>专列英语实训</title>
<style>
:root{--r:#8b1a1a;--g:#d4a24c;--bg:#fdf8f0;--tx:#3a2a2a;--mu:#8a7a74;--bd:#eadfce;--tn:#fbeeee}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.65 "Noto Sans SC","Microsoft YaHei",system-ui,sans-serif}
.hd{position:sticky;top:0;z-index:9;display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:10px 16px;background:linear-gradient(90deg,#6e1212,#9c2f2f);color:#fff;border-bottom:2px solid var(--g)}
.hd small{opacity:.8}
nav{display:flex;gap:4px;flex:1;justify-content:center;flex-wrap:wrap}
nav button,.hd>button{border:0;border-radius:16px;padding:5px 12px;background:none;color:#fff;font:inherit;cursor:pointer}
nav button.on{background:var(--g);color:#4a1010;font-weight:700}
.wrap{max-width:980px;margin:0 auto;padding:16px}
.tab[hidden]{display:none}
h1{margin:4px 0 12px;font-size:22px;color:var(--r)}
h2{margin:0 0 10px;font-size:16px;color:var(--r)}
h3{margin:14px 0 8px;font-size:14px;color:var(--r)}
.card{position:relative;overflow:hidden;background:#fff;border-radius:12px;padding:20px 20px 16px;margin:0 0 16px;box-shadow:0 2px 10px #8b1a1a14}
.card::before{content:"";position:absolute;left:0;right:0;top:0;height:4px;background:linear-gradient(90deg,var(--r),var(--g))}
.note,.mu{color:var(--mu)}.note{font-size:13px;margin:4px 0 10px}
.tip{background:#fbf3e4;border-left:4px solid var(--g);border-radius:6px;padding:10px 14px;margin:12px 0}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}
.sc{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th,td{border:1px solid var(--bd);padding:6px 8px;text-align:left;vertical-align:middle}
th{background:var(--tn);color:var(--r);white-space:nowrap}
td.r{color:var(--r);font-weight:700;text-align:center}
input[type=number]{width:68px;padding:5px 6px;border:1px solid var(--bd);border-radius:6px;font:inherit}
input[type=text],textarea,select{width:100%;padding:7px 9px;border:1px solid var(--bd);border-radius:6px;font:inherit;background:#fffdf9}
textarea{min-height:60px;resize:vertical}
label{display:block;margin:10px 0 4px;font-weight:700;color:var(--r)}
:focus-visible{outline:2px solid var(--g);outline-offset:1px}
.bt{padding:5px 14px;border:1px solid var(--r);border-radius:18px;background:#fff;color:var(--r);font:inherit;cursor:pointer}
.bt.pri{background:var(--r);color:#fff}.bt:hover{background:var(--tn)}.bt.pri:hover{background:#a52a2a}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;align-items:center}
.vg{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.vc{border:1px solid var(--bd);border-radius:10px;padding:10px 12px;background:#fffdf9}
.vc b{color:var(--r)}
.ln{border:1px solid var(--bd);border-left:4px solid var(--g);border-radius:8px;padding:8px 12px;margin:8px 0}
.ln.q{border-left-color:#3b6ea8;background:#f3f8fd}
.en{font-weight:600}.zh{color:var(--mu);font-size:13px}
.bb{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:6px}
.bb .bt{padding:3px 11px;font-size:13px}
.rs{font-size:13px}.ok{color:#2e7d5b}.no{color:#b03030}
.tg{display:inline-block;font-size:12px;color:#3b6ea8;margin-right:6px}
.dl{border-left:4px solid var(--g);background:#fff8ec;border-radius:8px;padding:8px 12px;margin:8px 0}
.dl.p{border-left-color:#3b6ea8;background:#f3f8fd}
.dl b{font-size:12px;color:var(--mu)}
.chips{max-height:150px;overflow:auto;border:1px solid var(--bd);border-radius:8px;padding:6px;background:#faf6ef}
.chip{margin:2px;padding:2px 9px;border:1px dashed #cdbda4;border-radius:12px;background:#fff;font:12px inherit;cursor:pointer;text-align:left}
.tn{display:grid;grid-template-columns:110px 1fr auto;gap:8px;margin:8px 0;align-items:start}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:12px}
.st{border:1px solid var(--bd);border-radius:10px;padding:8px 12px;background:#fffdf9}
.st span{display:block;color:var(--mu);font-size:12px}.st b{font-size:20px;color:var(--r)}
.tot{display:flex;justify-content:space-between;align-items:center;padding:12px 18px;border-radius:10px;color:#fff;background:linear-gradient(90deg,var(--r),var(--g));font-weight:700}
.tot b{font-size:30px}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;align-items:center;margin-top:14px}
@media(max-width:700px){.two,.tn{grid-template-columns:1fr}}
.lg{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;font-size:12px;color:var(--mu)}
.lg i{display:inline-block;width:14px;height:3px;margin-right:4px;vertical-align:middle}
svg{display:block;margin:0 auto;max-width:300px;width:100%;height:auto}
footer{text-align:center;color:var(--mu);font-size:12px;padding:16px}
@media print{.hd{display:none}.tab{display:block!important}.card{box-shadow:none;break-inside:avoid}}

.hd .export-btn{background:#f3d28b;color:#4a1010;font-weight:700;border:1px solid #e7bf68;white-space:nowrap}
.hd .export-btn:hover{background:#ffe4a8}
.export-hint{font-size:12px;color:#735d3b;background:#fff7e7;border:1px solid #f0dfbd;border-radius:8px;padding:8px 12px;margin:8px 0 14px}
@media(max-width:760px){.hd .export-btn{padding:5px 9px;font-size:12px}}

</style>
</head>
<body>

  <div class="card"><h2 id="ch"></h2>
    <div class="grid">

      <div><label for="cs2" style="margin-top:0">日期</label><input class="sv" type="text" id="cs2" placeholder="请填写案例日期"></div>

    <div class="grid" id="sg"></div>
    <div class="tip" id="ckey"></div>
  </div>
</section>
<section class="tab" id="tab2" hidden></section>
<section class="tab" id="tab3" hidden></section>
<section class="tab" id="tab4" hidden></section>
<section class="tab" id="tab5" hidden></section>
<section class="tab" id="tab6" hidden></section>

<script>
/* ============================================================
   专列英语实训系统 · 任务模板
   用法：复制本文件，只修改下面这一个 TASK 对象，其余代码不要动。
   ① id 每个任务必须不同（用来隔离各任务的本地数据）。
   ② scenarios 必须正好 4 个情境，dialogs 必须正好 4 段对话。
   ③ 文本里不要出现反引号 ` 和 ${ 。需要加粗可用 <b>…</b>。
   ④ 英文句子里的引号和撇号请用 “ ” ’ ，不要用直引号。
   ============================================================ */
const TASK={
  id:'task5',
  icon:'🚄',
  brand:'山河专列',
  station:'敦煌站',
  short:'敦煌站',
  title:'山河专列·敦煌站',

  project:'一带一路文化专列',
  slogan:'用英语讲好中国故事',

  intro:`本实训基于“山河专列”开往敦煌的高铁乘务服务案例设计。围绕<b>登车迎客、车厢广播、主题特产销售、车厢主题互动</b>四大情境，通过词汇跟读评分、句型逐句学习、对话卡片演练、模拟展演编排、多元评价五个环节，掌握 40 个敦煌与山河文化核心词汇、4 类情境句型和 4 个完整对话，感悟<b>莫高窟壁画、飞天艺术</b>与大漠山河之美。本任务是“一带一路文化专列”的一站，学习目标是用英语讲好中国故事。`,
  feature:`① 每个单词和每个句子都可点击发音；② 跟读后系统按识别结果给出得分；③ 对话卡片支持整段播放与本组录音；④ 展演脚本含“旅客文化追问”，并留有 AI 润色稿与修改说明；⑤ 成绩由系统、教师、其他小组和本组共同评价。`,

  caseStage:`全程乘务服务（登车迎客 → 车厢广播 → 特产销售 → 主题互动 → 到站送别）`,
  caseDesc:`在一趟开往敦煌的“山河专列”高铁上，4 人乘务组为旅客提供全程服务：<b>登车迎客</b>（检票验票、座位指引、行李协助），<b>车厢广播</b>（欢迎词、敦煌与山河风光介绍、到站提醒），<b>主题特产销售</b>（飞天书签、壁画明信片、敦煌杏干、扫码支付与优惠），<b>车厢主题互动</b>（敦煌文化知识问答、莫高窟与鸣沙山讲解、奖品赠送）。乘务员需用英语专业、礼貌、热情地与旅客沟通，并在服务中传递<b>敦煌艺术</b>与<b>大漠山河文化</b>。`,
  caseKey:`4 人乘务组分工协作，覆盖四大核心情境。展演要求：每组选一个场景，不超过 3 分钟，至少包含 1 个旅客文化追问。`,
  bri:`敦煌地处丝绸之路的咽喉要道，是多种文明交汇之地。莫高窟的艺术融合了中外风格，是丝路上“互学互鉴”的生动见证。`,

  vocabTitle:'敦煌与山河文化词汇',
  vocab:`
# 服务通用词
themed train|θiːmd treɪn|主题列车
Mountains and Rivers Themed Train|ˈmaʊntɪnz ənd ˈrɪvəz θiːmd treɪn|山河专列
steward|ˈstjuːəd|乘务员
carriage|ˈkærɪdʒ|车厢
platform|ˈplætfɔːm|站台
boarding|ˈbɔːdɪŋ|登车
announcement|əˈnaʊnsmənt|广播通知
souvenir|ˌsuːvəˈnɪə|纪念品
passenger|ˈpæsɪndʒə|旅客
onboard service|ˈɒnbɔːd ˈsɜːvɪs|车厢服务
# 敦煌与山河文化词
Dunhuang|ˌdʊnˈhwɑːŋ|敦煌
Mogao Caves|ˌməʊˈɡaʊ keɪvz|莫高窟
mural|ˈmjʊərəl|壁画
Flying Apsaras|ˈflaɪɪŋ ˈæpsərəz|飞天
painted sculpture|ˈpeɪntɪd ˈskʌlptʃə|彩塑
Buddhist|ˈbʊdɪst|佛教的
Buddha|ˈbʊdə|佛
grotto|ˈɡrɒtəʊ|石窟
Mingsha Mountain|ˌmɪŋˈʃɑː ˈmaʊntɪn|鸣沙山
Crescent Spring|ˈkresnt sprɪŋ|月牙泉
sand dune|sænd djuːn|沙丘
desert|ˈdezət|沙漠
oasis|əʊˈeɪsɪs|绿洲
yardang|ˈjɑːdæŋ|雅丹地貌
Hexi Corridor|ˌhʌˈʃiː ˈkɒrɪdɔː|河西走廊
Yumen Pass|ˌjuːˈmʌn pɑːs|玉门关
camel|ˈkæml|骆驼
pigment|ˈpɪɡmənt|颜料
manuscript|ˈmænjuskrɪpt|古代文献
Silk Road|sɪlk rəʊd|丝绸之路
# 一带一路文化词
Belt and Road Initiative|ˌbelt ənd ˈrəʊd ɪˈnɪʃətɪv|“一带一路”倡议
cultural exchange|ˈkʌltʃərəl ɪksˈtʃeɪndʒ|文化交流
mutual learning|ˈmjuːtʃuəl ˈlɜːnɪŋ|互学互鉴
Silk Road spirit|sɪlk rəʊd ˈspɪrɪt|丝路精神
# 拓展词
magnificent|mæɡˈnɪfɪsnt|宏伟的
graceful|ˈɡreɪsfl|优美的
ancient|ˈeɪnʃənt|古老的
protect|prəˈtekt|保护
preserve|prɪˈzɜːv|保存
guardian|ˈɡɑːdiən|守护者
`,

  scenarios:[
    {name:'登车迎客',en:'Boarding & Welcome',
     sents:`
Good morning, welcome aboard the Mountains and Rivers Themed Train.|早上好，欢迎乘坐山河专列。
May I see your ticket and ID card, please?|请出示您的车票和身份证好吗？
Your seat is 9A in Car 2. Please go this way.|您的座位是2号车厢9A，请这边走。
Let me help you with your carry-on.|我来帮您拿随身行李。
Please place your suitcase on the overhead rack.|请把行李箱放在行李架上。
Mind your step and hold the handrail, please.|请小心脚下，扶好扶手。
This train is decorated with Dunhuang mural patterns and desert scenery.|这列火车以敦煌壁画纹样和大漠风光装饰。
If you need anything, please let me know.|如有需要，请随时告诉我。`,
     qa:`
Why is this train called the Mountains and Rivers Themed Train?|Because it carries passengers through great mountains, deserts, and rivers to Dunhuang.
Who are the figures on the train wall?|They are Flying Apsaras, heavenly dancers and musicians from the Dunhuang murals.`},
    {name:'车厢广播',en:'Onboard Announcements',
     sents:`
Ladies and gentlemen, welcome aboard the Mountains and Rivers Themed Train, bound for Dunhuang, the pearl of the Silk Road.|女士们，先生们，欢迎乘坐山河专列，本次列车开往丝绸之路上的明珠敦煌。
Dunhuang is an oasis city at an important crossing of the ancient Silk Road.|敦煌是古丝绸之路要冲上的绿洲城市。
The Mogao Caves were carved over a thousand years and are famous for their murals and statues.|莫高窟开凿延续千余年，以壁画和彩塑闻名。
The Flying Apsaras are graceful heavenly figures that seem to float in the sky.|飞天是优美的天人形象，仿佛在空中飘舞。
Mingsha Mountain is a giant sand dune, and Crescent Spring lies at its foot.|鸣沙山是巨大的沙丘，月牙泉就在它的脚下。
The Yumen Pass was once an important gateway on the Silk Road.|玉门关曾是丝绸之路上的重要关隘。
During today’s journey, you will have the chance to enjoy the great landscapes and ancient art of the northwest.|在今天的旅途中，您将有机会欣赏西北的壮美山河与古老艺术。
Dunhuang art shows how Chinese and foreign cultures learned from each other.|敦煌艺术展现了中外文化如何互学互鉴。
We will arrive at Dunhuang in about ten minutes. Please take all your belongings with you.|列车将在约十分钟后到达敦煌，请带好您的随身物品。`,
     qa:`
Why do the Mogao Caves have so many murals?|Because monks, artists, and believers painted them over many centuries.
Do I need to book tickets for the Mogao Caves?|Yes. Tickets must be booked in advance, and the number of daily visitors is limited.`},
    {name:'主题特产销售',en:'Specialty Product Sales',
     sents:`
Would you like to see some local specialties from Dunhuang?|您想看看敦煌的当地特产吗？
This is a Flying Apsaras bookmark set, inspired by the Dunhuang murals.|这是一套飞天书签，灵感来自敦煌壁画。
The colors come from the traditional patterns of the Mogao Caves.|色彩取自莫高窟的传统纹样。
These are dried apricots from Dunhuang. They are sweet and chewy.|这是敦煌杏干，香甜有嚼劲。
This is a set of mural postcards, a perfect gift for your friends.|这是一套壁画明信片，送朋友很合适。
The price is 68 yuan, and we offer a 10% discount today.|价格是68元，今天我们提供九折优惠。
You can scan the QR code to pay.|您可以扫码支付。
Would you like a gift box? It’s complimentary.|需要礼盒吗？免费提供。`,
     qa:`
What are the murals painted with?|They are painted with natural mineral pigments, so the colors can last for a long time.
Why are Dunhuang apricots so sweet?|Because the desert area has strong sunshine and a big difference between day and night temperatures.`},
    {name:'车厢主题互动',en:'Onboard Theme Interaction',
     sents:`
Welcome to our Dunhuang culture corner.|欢迎来到我们的敦煌文化角。
Would you like to join our quiz about Dunhuang and its art?|您愿意参加敦煌与敦煌艺术问答吗？
What are the most famous treasures of Dunhuang?|敦煌最著名的瑰宝有哪些？
They are the Mogao Caves, the murals, and the Flying Apsaras.|是莫高窟、壁画和飞天。
In 1900, a hidden cave was found with tens of thousands of ancient documents.|1900年，人们发现了一个藏有数以万计古代文献的洞窟。
Mingsha Mountain makes a soft sound when the sand slides down.|沙子滑落时，鸣沙山会发出轻柔的声音。
Generations of guardians have worked hard to protect this cultural treasure.|几代守护人为保护这份文化瑰宝付出了艰辛努力。
Merchants, monks, and artists met in Dunhuang, and ideas travelled with them.|商人、僧人和艺术家在敦煌相遇，思想也随之传播。
Thank you for participating. We hope you had a memorable time.|感谢参与，希望您度过了难忘的时光。`,
     qa:`
Why is the mountain called Mingsha, or “singing sand”?|Because the moving sand makes a sound like music.
What is a yardang?|It is a rock landform shaped by strong wind over a long time.
How is Dunhuang connected with the Belt and Road?|It was a meeting place of different cultures on the Silk Road, so its art shows mutual learning.`}
  ],

  dialogs:[
`A:Good morning, welcome aboard the Mountains and Rivers Themed Train.
P:Thank you. Here is my ticket.
A:May I see your ticket and ID card, please?
P:Here you are.
A:Your seat is 9A in Car 2. Please go this way.
P:This train looks beautiful. What are those figures on the wall?
A:This train is decorated with Dunhuang mural patterns and desert scenery.
P:How interesting! Could you help me with my bag?
A:Let me help you with your carry-on.
P:Thank you so much.
A:If you need anything, please let me know.`,
`A:Ladies and gentlemen, welcome aboard the Mountains and Rivers Themed Train, bound for Dunhuang, the pearl of the Silk Road.
P:Wow, that sounds amazing! What is Dunhuang famous for?
A:The Mogao Caves were carved over a thousand years and are famous for their murals and statues.
P:Who are the dancing figures in the murals?
A:The Flying Apsaras are graceful heavenly figures that seem to float in the sky.
P:I can’t wait to see them in Dunhuang.
A:During today’s journey, you will have the chance to enjoy the great landscapes and ancient art of the northwest.`,
`A:Would you like to see some local specialties from Dunhuang?
P:Sure. What do you have?
A:This is a Flying Apsaras bookmark set, inspired by the Dunhuang murals.
P:It’s beautiful! Do you have anything to eat?
A:These are dried apricots from Dunhuang. They are sweet and chewy.
P:Lovely. Do you have something for my friends?
A:This is a set of mural postcards, a perfect gift for your friends.
P:Nice. How much is it?
A:The price is 68 yuan, and we offer a 10% discount today.
P:That sounds good. Can I pay by phone?
A:You can scan the QR code to pay.
P:Great, I’ll take the bookmarks and the postcards.

const AUDIO_DB_NAME='hsr_task_audio_v1';

let audioDbPromise=null;
function openAudioDB(){
  if(!('indexedDB' in window)) return Promise.reject(new Error('当前浏览器不支持本地录音持久保存'));

  audioDbPromise=new Promise((resolve,reject)=>{

    req.onupgradeneeded=()=>{const db=req.result;if(!db.objectStoreNames.contains(AUDIO_STORE))db.createObjectStore(AUDIO_STORE,{keyPath:'key'})};
    req.onsuccess=()=>resolve(req.result);

const num=(el,m)=>{const v=parseFloat(el.value);return isNaN(v)?0:Math.min(Math.max(v,0),m)};

function calc(){
  const proc=[0,1,2].map(i=>num($('ep'+i),10)),sec=parseFloat($('etm').value)||0,ded=sec>180?Math.floor((sec-180)/10):0;
  const t=DM.map((d,i)=>num($('et'+i),d[1])),s=DM.map((d,i)=>num($('es'+i),d[1]));
  t[4]=Math.max(0,t[4]-ded);
  let rows=Q('#epb tr').map(r=>Q('input[type=number]',r).map(e=>num(e,10)));
  const n=rows.length;
  if(n>=3)rows=rows.slice().sort((a,b)=>a[0]+a[1]+a[2]-b[0]-b[1]-b[2]).slice(1,-1);
  const pa=[0,1,2].map(j=>rows.length?rows.reduce((a,r)=>a+r[j],0)/rows.length:0);
  const T=t.reduce((a,b)=>a+b,0),S=s.reduce((a,b)=>a+b,0),Pp=(pa[0]+pa[1]+pa[2])/30*100;
  const show=n?T*.6+Pp*.3+S*.1:(T*.6+S*.1)/.7,pr=proc.reduce((a,b)=>a+b,0),ex=show*.7;
  return{pr,sec,ded,t,s,pa,n,used:rows.length,T,S,Pp,ex,total:pr+ex};
}
function radar(r){
  const c=130,R=92,pt=(i,f)=>{const a=-Math.PI/2+i*2*Math.PI/5;return[c+R*f*Math.cos(a),c+R*f*Math.sin(a)]},q=p=>p.map(x=>x.toFixed(1)).join(',');
  const poly=(fs,col,dash)=>{const p=fs.map((f,i)=>f==null?null:pt(i,f)).filter(Boolean);return p.length<2?'':`<polygon points="${p.map(q).join(' ')}" fill="${col}" fill-opacity="${dash?0:.12}" stroke="${col}" stroke-width="2"${dash?' stroke-dasharray="5 3"':''}/>`};
  let g='';
  [.25,.5,.75,1].forEach(f=>{g+=`<polygon points="${DM.map((_,i)=>q(pt(i,f))).join(' ')}" fill="none" stroke="#eadfce"/>`});
  DM.forEach((d,i)=>{const e=pt(i,1),l=pt(i,1.2);g+=`<line x1="${c}" y1="${c}" x2="${e[0].toFixed(1)}" y2="${e[1].toFixed(1)}" stroke="#eadfce"/><text x="${l[0].toFixed(1)}" y="${(l[1]+4).toFixed(1)}" text-anchor="middle" font-size="12" fill="#8b1a1a">${d[0]}</text>`});
  g+=poly(r.t.map((v,i)=>v/DM[i][1]),'#8b1a1a')+poly(r.s.map((v,i)=>v/DM[i][1]),'#2e7d5b')+(r.n?poly([r.pa[0]/10,r.pa[1]/10,null,r.pa[2]/10,null],'#d4a24c',1):'');
  return`<svg viewBox="0 0 260 260" role="img" aria-label="五维得分率雷达图">${g}</svg>`;
}
